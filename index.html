<!DOCTYPE html>
<html>
<head>
    <title>AI Chatbot</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 100px;
        }
        input {
            padding: 10px;
            width: 300px;
        }
        button {
            padding: 10px;
        }
        #reply {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<h2>AI Chatbot 🤖</h2>

<input id="msg" placeholder="Ask something">
<button onclick="send()">Send</button>

<p id="reply"></p>

<script>
async function send() {
    let message = document.getElementById("msg").value;

    let res = await fetch("http://127.0.0.1:5000/chat", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({message: message})
    });

    let data = await res.json();
    document.getElementById("reply").innerText = data.reply;
}
</script>

</body>
</html>
